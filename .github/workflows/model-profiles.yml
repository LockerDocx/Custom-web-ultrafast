name: Model profiles

# "Use glm-5.3 flash without reasoning" is a speed idea with a quality question attached, and
# neither half can be answered by reading a model card. Each candidate runs as its own job, in
# parallel, against the live APIs with the repository's keys, and reports:
#
#   speed   — median and worst latency per role, from the prompts the agent really sends
#   quality — valid plans (planner), routing accuracy on the project's own 241-mission battery
#             (executor), and the exact field value the goal supplied (text writer)
#
# A profile whose model id does not exist is reported as such, from the provider's own catalogue,
# instead of being scored zero for a reason nobody can see.

on:
  workflow_dispatch:
    inputs:
      profiles:
        description: "Comma-separated profiles (empty = all of them)"
        required: false
        default: ""
      planner_budget:
        description: "Extra tokens for the planner (the app asks for 1024); empty = unchanged"
        required: false
        default: ""
  push:
    paths:
      - ".github/workflows/model-profiles.yml"
      - "scripts/bench_profiles.py"

permissions:
  contents: read

jobs:
  # The list of candidates comes from the script itself (or from the dispatch input), so the
  # workflow can never drift away from the profiles that actually exist.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.pick.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Which profiles to measure
        id: pick
        env:
          ASKED: ${{ github.event.inputs.profiles }}
        run: |
          pip install -e . >/dev/null
          ALL=$(python scripts/bench_profiles.py --list --names | paste -sd, -)
          CHOSEN="${ASKED:-$ALL}"
          echo "list=$(printf '%s' "$CHOSEN" | python -c 'import json,sys; print(json.dumps([p.strip() for p in sys.stdin.read().split(",") if p.strip()]))')" >> "$GITHUB_OUTPUT"

  profile:
    needs: prepare
    name: profile ${{ matrix.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.prepare.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . "httpx[http2]" browser-harness==0.1.13
      - name: Measure ${{ matrix.profile }}
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$NVIDIA_API_KEY" ] && [ -z "$GROQ_API_KEY" ]; then
            echo "No provider secrets configured; nothing to measure."
            exit 0
          fi
          {
            echo "## Model profile: ${{ matrix.profile }}"
            echo
            python scripts/bench_profiles.py --profile "${{ matrix.profile }}" \
              --routing-sample 12 --plans 3 --text-cases 4 \
              ${{ github.event.inputs.planner_budget && format('--planner-budget {0}', github.event.inputs.planner_budget) || '' }} \
              --json "artifacts/profile-${{ matrix.profile }}.json"
          } | tee /tmp/report.md
          {
            echo "## Model profile: ${{ matrix.profile }}"
            echo
            cat /tmp/report.md
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-${{ matrix.profile }}
          path: artifacts/profile-*.json
          if-no-files-found: ignore
