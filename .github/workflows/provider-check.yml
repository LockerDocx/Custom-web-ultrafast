name: Provider check

# Diagnostic: pings each configured model provider with a tiny real request and
# comments the per-role results on the PR. Keys come from repository secrets
# (NVIDIA_API_KEY / GROQ_API_KEY); the check is skipped when no key is set.

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "scripts/check_providers.py"
  push:
    paths:
      - ".github/workflows/provider-check.yml"
      - "scripts/check_providers.py"

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . "httpx[http2]" browser-harness==0.1.13
      - name: Check the configured providers
        env:
          # Deliberately NO provider/model configuration: this check tests the same
          # zero-config path a new user gets. With these two keys the agent must derive
          # planner -> nvidia:z-ai/glm-5.3 and executor/text -> groq:openai/gpt-oss-20b
          # (providers.DERIVED_MODELS), which is the measured-best arrangement. If the
          # derivation ever picks something else, the report shows it here.
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          POLICY_REASONING: low
          TEXT_MODEL_REASONING: low
        run: |
          if [ -z "$NVIDIA_API_KEY" ] && [ -z "$GROQ_API_KEY" ]; then
            echo "No provider secrets configured (NVIDIA_API_KEY / GROQ_API_KEY)."
            echo "Add them under Settings -> Secrets and variables -> Actions to enable this check."
            exit 0
          fi
          python scripts/check_providers.py | tee /tmp/report.md
      - name: Comment on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/comment_on_pr.sh /tmp/report.md
