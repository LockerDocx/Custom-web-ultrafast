name: Release artifacts

# Builds the downloadable artifacts (source ZIP, Firefox .xpi, Python wheel)
# and attaches them to the GitHub release for the pushed tag.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: |
          python -m pip install --upgrade pip build
          pip install -e . pytest ruff "httpx[http2]" browser-harness==0.1.13
      - name: Checks
        run: |
          ruff check .
          pytest -q
          node --check jev_ultrafast/static/app.js
          node --check extension/background.js
          node --check extension/content.js
          node --check extension/sidebar/sidebar.js
      - name: Build artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python -m build --wheel --outdir dist
          (cd extension && zip -r -q "../jev-agent-firefox-${GITHUB_REF_NAME}.xpi" .)
          git archive --format=zip -o "custom-web-ultrafast-${GITHUB_REF_NAME}-source.zip" HEAD
          ls -la dist *.xpi *-source.zip
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          RELEASE_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq .id)
          echo "Uploading to release id $RELEASE_ID"
          upload() {
            local file="$1" attempt
            for attempt in 1 2 3; do
              if curl -sSf -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Content-Type: application/octet-stream" \
                --data-binary @"$file" \
                "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$(basename "$file")" >/dev/null; then
                echo "uploaded $(basename "$file")"
                return 0
              fi
              echo "retry $attempt for $(basename "$file")"
              sleep 5
            done
            echo "FAILED to upload $(basename "$file")"
            return 1
          }
          upload "dist/jev_ultrafast-${VERSION}-py3-none-any.whl"
          upload "jev-agent-firefox-${GITHUB_REF_NAME}.xpi"
          upload "custom-web-ultrafast-${GITHUB_REF_NAME}-source.zip"
