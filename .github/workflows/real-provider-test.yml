name: Real provider test

# Real-provider test of the per-model parameter engine (MVP-1): discovery,
# per-model surfaces, live probe, role wiring and one real request per role —
# all against the live NVIDIA endpoint, on exactly the defaults a fresh install derives.
# Keys come from repository secrets (NVIDIA_API_KEY, optionally GROQ_API_KEY); the run is
# skipped without them. A 401 from the optional Groq key is reported, not fatal: the key
# that has to work is NVIDIA's.
#
# Run it from the Actions tab (workflow_dispatch) or with a push to either file.

on:
  workflow_dispatch: {}
  push:
    paths:
      - ".github/workflows/real-provider-test.yml"
      - "scripts/real_provider_test.py"

permissions:
  contents: read

jobs:
  real-provider-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . "httpx[http2]" browser-harness==0.1.13
      - name: Exercise the parameter engine against the live providers
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # The shipped defaults: one NVIDIA key runs all three roles on the model that was
          # measured fastest on the role called at every step. This used to exercise the
          # NVIDIA-plans/Groq-executes split, which is no longer what a fresh install derives
          # (Groq's 8 000 tokens per minute are spent mid-mission).
          PLANNER_PROVIDER: nvidia
          PLANNER_MODEL: z-ai/glm-5.3
          POLICY_PROVIDER: nvidia
          POLICY_MODEL: z-ai/glm-5.3
          TEXT_MODEL_PROVIDER: nvidia
          TEXT_MODEL: z-ai/glm-5.3
        run: |
          if [ -z "$NVIDIA_API_KEY" ] && [ -z "$GROQ_API_KEY" ]; then
            echo "No provider secrets configured (NVIDIA_API_KEY / GROQ_API_KEY)."
            echo "Add them under Settings -> Secrets and variables -> Actions to enable this test."
            exit 0
          fi
          set +e
          python scripts/real_provider_test.py | tee /tmp/real-provider-report.md
          status=${PIPESTATUS[0]}
          {
            echo "## Real provider test"
            echo
            cat /tmp/real-provider-report.md
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
