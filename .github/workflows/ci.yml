name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  opensuse:
    name: openSUSE ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # SUSE package names carry no dot (python312, never python3.12) and a
          # release's default python3 can be far older than the agent needs: Leap
          # 15.6 ships Python 3.6 as `python3`, so the starter has to pick
          # /usr/bin/python3.12 instead of settling for the first python3 it meets.
          # These are exactly the packages the starter tells a SUSE user to
          # install, and both names were checked against the release repositories.
          - image: opensuse/leap:15.6
            packages: python312 python312-pip
            interpreter: python3.12
          - image: opensuse/tumbleweed:latest
            packages: python313 python313-pip
            interpreter: python3.13
    container:
      image: ${{ matrix.image }}
    steps:
      # No actions/checkout here: the container has to gain git and Python first,
      # which is exactly the path an openSUSE user walks through.
      - name: Install git and Python the way openSUSE does
        run: |
          zypper --non-interactive --gpg-auto-import-keys refresh
          zypper --non-interactive install git ${{ matrix.packages }}
      - name: The starter must pick this release's interpreter
        run: |
          git clone --depth 1 https://github.com/${{ github.repository }}.git /src
          cd /src
          # JEV_START_DRY_RUN stops the starter right after it picked an interpreter
          JEV_START_DRY_RUN=1 bash start-host.sh | tee /tmp/picked
          # It must be the new one, not the 3.6 that also answers to `python3`
          grep -qx "PYTHON=${{ matrix.interpreter }}" /tmp/picked
      - name: Install and test inside openSUSE
        run: |
          cd /src
          ${{ matrix.interpreter }} -m venv .venv
          .venv/bin/python -m pip install --quiet --upgrade pip
          .venv/bin/python -m pip install --quiet -e ".[documents]" pytest ruff
          .venv/bin/python -m ruff check .
          .venv/bin/python -m pytest -q
      - name: The host registers itself for Firefox (no admin rights)
        run: |
          cd /src
          .venv/bin/jev-register-host
          .venv/bin/jev-register-host --status
          test -f "$HOME/.mozilla/native-messaging-hosts/jev_ultrafast_host.json"
          grep -q "allowed_extensions" "$HOME/.mozilla/native-messaging-hosts/jev_ultrafast_host.json"

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[documents]" pytest
      - name: The Windows-specific paths (native messaging over stdio, registry, key setup)
        run: pytest tests/test_native_host.py tests/test_setup.py -q
      - name: The double-click starter must drive the py launcher
        shell: pwsh
        run: |
          $text = Get-Content start-host.bat -Raw
          if ($text -notmatch 'py -3 -c "import sys') { throw "the starter does not try the py launcher" }
          if ($text -notmatch '%PY% -m venv') { throw "the venv is not built with the discovered interpreter" }
          python -c "import jev_ultrafast.firefox, jev_ultrafast.native_setup, jev_ultrafast.providers; print('imports OK')"

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is what openSUSE Leap 15.6 ships as python3; 3.12/3.13 are current
        # elsewhere. If the package ever drifts to 3.12-only syntax, this catches it.
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[documents]" pytest ruff "httpx[http2]" browser-harness==0.1.13
      - name: The double-click starters must stay executable
        # The sandbox/CI filesystem reports them as 0644, so a plain `git add -A`
        # silently strips the bit from someone's double-click entry point.
        run: |
          bad=$(git ls-files -s start-host.sh start-host.command install-laya.sh install-laya.command \
                | awk '$1 != "100755" {print $4}')
          if [ -n "$bad" ]; then
            echo "These starters lost their executable bit: $bad"
            echo "Fix with: git update-index --chmod=+x $bad"
            exit 1
          fi
          echo "All starters are 100755."
      - name: Lint
        run: ruff check .
      - name: Tests
        run: |
          set +e
          pytest -q 2>&1 | tee /tmp/pytest.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # A red test must be identifiable from the API: annotations survive what
            # job logs do not (they live on blob storage with their own lifetime).
            grep -E "^(FAILED|ERROR)" /tmp/pytest.log | head -10 | while IFS= read -r line; do
              echo "::error title=pytest::${line}"
            done
            tail -40 /tmp/pytest.log | cut -c1-300 | while IFS= read -r line; do
              echo "::warning title=pytest-detail::${line}"
            done
          fi
          exit "$status"
      - name: Tests under a legacy code page
        # Windows does not default to UTF-8: this catches the file I/O that
        # would only ever fail on a user's machine.
        run: |
          LC_ALL=C LANG=C PYTHONUTF8=0 PYTHONCOERCECLOCALE=0 pytest -q
      - name: JS syntax
        run: |
          node --check jev_ultrafast/static/app.js
          node --check jev_ultrafast/snapshot.js
          node --check extension/background.js
          node --check extension/content.js
          node --check extension/sidebar/sidebar.js
