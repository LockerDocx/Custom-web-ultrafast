<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Jev Agent — open-source Firefox AI agent">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#131a33"/>
      <stop offset="100%" stop-color="#1d1030"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff8a3d"/>
      <stop offset="100%" stop-color="#ff4d6d"/>
    </linearGradient>
    <linearGradient id="focus" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.045" stroke-width="1">
    <path d="M0 65h1200M0 130h1200M0 195h1200"/>
    <path d="M150 0v260M300 0v260M450 0v260M600 0v260M750 0v260M900 0v260M1050 0v260"/>
  </g>

  <!-- firefox-ish orbit -->
  <g transform="translate(1040 130)" opacity="0.9">
    <circle r="92" fill="none" stroke="url(#focus)" stroke-width="2" stroke-opacity="0.55"/>
    <circle r="66" fill="none" stroke="url(#flame)" stroke-width="2" stroke-opacity="0.35"/>
    <path d="M-92 0a92 92 0 0 1 184 0" fill="none" stroke="url(#flame)" stroke-width="10" stroke-opacity="0.85" stroke-linecap="round"/>
    <circle cx="52" cy="-76" r="9" fill="#38bdf8"/>
  </g>

  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <text x="72" y="112" font-size="76" font-weight="700" fill="#ffffff" letter-spacing="-1.5">Jev Agent</text>
    <text x="74" y="158" font-size="27" fill="#b9c4e0" letter-spacing="0.2">The open-source AI agent that drives your Firefox</text>

    <g transform="translate(74 186)">
      <rect x="0" y="0" width="196" height="34" rx="17" fill="#ffffff" fill-opacity="0.07"/>
      <text x="98" y="23" font-size="15" fill="#e6ecff" text-anchor="middle">one free API key</text>
      <rect x="208" y="0" width="104" height="34" rx="17" fill="#ffffff" fill-opacity="0.07"/>
      <text x="260" y="23" font-size="15" fill="#e6ecff" text-anchor="middle">open source</text>
      <rect x="324" y="0" width="218" height="34" rx="17" fill="#ffffff" fill-opacity="0.07"/>
      <text x="433" y="23" font-size="15" fill="#e6ecff" text-anchor="middle">Windows · Linux · macOS</text>
      <rect x="554" y="0" width="168" height="34" rx="17" fill="#ffffff" fill-opacity="0.07"/>
      <text x="638" y="23" font-size="15" fill="#e6ecff" text-anchor="middle">Firefox 109+</text>
    </g>
  </g>
</svg>
